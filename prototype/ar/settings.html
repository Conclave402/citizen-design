<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مواطن كوغناي | الإعدادات</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<a class="skip-link" href="#main">انتقل إلى المحتوى</a>
<header class="app-header">
  <a class="app-header__brand" href="lobby.html">مواطن كوغناي</a>
  <nav class="app-header__nav" aria-label="اللغة">
    <a href="../settings.html" lang="en" hreflang="en">English</a>
  </nav>
</header>
<main class="app-main" id="main">
  <h1>الإعدادات</h1>

  <form action="settings.html" method="get">
    <section class="card" aria-labelledby="profile">
      <h2 id="profile">الملف الشخصي</h2>
      <div class="field">
        <label for="name">اسم المواطن</label>
        <input id="name" name="name" type="text" value="نور" autocomplete="off">
      </div>
      <div class="field">
        <label for="voice">الصوت</label>
        <select id="voice" name="voice">
          <option value="warm">دافئ ومباشر</option>
          <option value="plain">بسيط وقصير</option>
          <option value="formal">رسمي</option>
        </select>
      </div>
      <div class="field">
        <label for="language">اللغة</label>
        <select id="language" name="language">
          <option value="ar">العربية</option>
          <option value="en">الإنجليزية</option>
        </select>
      </div>
    </section>

    <section class="card" aria-labelledby="appearance">
      <h2 id="appearance">المظهر</h2>
      <div class="field">
        <label for="theme">السمة</label>
        <select id="theme" name="theme">
          <option value="system">اتبع النظام</option>
          <option value="light">فاتح</option>
          <option value="dark">داكن</option>
        </select>
      </div>
      <div class="field">
        <input id="notify" name="notify" type="checkbox" checked>
        <label for="notify" style="display: inline">أعلمني عند قبول عمل</label>
      </div>
    </section>

    <button class="btn btn--block" type="submit">حفظ التغييرات</button>
  </form>

  <section class="card" aria-labelledby="danger" style="margin-block-start: var(--space-4)">
    <h2 id="danger">تصفير</h2>
    <p class="text-muted">التصفير يحذف الذاكرة والمفاتيح المحلية. تبقى الأرصدة على السلسلة.</p>
    <button class="btn btn--danger" type="button">تصفير المواطن</button>
  </section>
</main>
<nav class="bottom-nav" aria-label="التنقل الرئيسي">
  <a href="lobby.html">الردهة</a>
  <a href="chat.html">المحادثة</a>
  <a href="services.html">الخدمات</a>
  <a href="wallet.html">المحفظة</a>
</nav>
</body>
</html>
