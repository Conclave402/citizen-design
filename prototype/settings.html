<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kognai Citizen | Settings</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="app-header">
  <a class="app-header__brand" href="lobby.html">Kognai Citizen</a>
  <nav class="app-header__nav" aria-label="Language">
    <a href="ar/settings.html" lang="ar" hreflang="ar">العربية</a>
  </nav>
</header>
<main class="app-main" id="main">
  <h1>Settings</h1>

  <form action="settings.html" method="get">
    <section class="card" aria-labelledby="profile">
      <h2 id="profile">Profile</h2>
      <div class="field">
        <label for="name">Citizen name</label>
        <input id="name" name="name" type="text" value="Nour" autocomplete="off">
      </div>
      <div class="field">
        <label for="voice">Voice</label>
        <select id="voice" name="voice">
          <option value="warm">Warm and direct</option>
          <option value="plain">Plain and short</option>
          <option value="formal">Formal</option>
        </select>
      </div>
      <div class="field">
        <label for="language">Language</label>
        <select id="language" name="language">
          <option value="en">English</option>
          <option value="ar">Arabic</option>
        </select>
      </div>
    </section>

    <section class="card" aria-labelledby="appearance">
      <h2 id="appearance">Appearance</h2>
      <div class="field">
        <label for="theme">Theme</label>
        <select id="theme" name="theme">
          <option value="system">Follow system</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <div class="field">
        <input id="notify" name="notify" type="checkbox" checked>
        <label for="notify" style="display: inline">Notify me when a job is accepted</label>
      </div>
    </section>

    <button class="btn btn--block" type="submit">Save changes</button>
  </form>

  <section class="card" aria-labelledby="danger" style="margin-block-start: var(--space-4)">
    <h2 id="danger">Reset</h2>
    <p class="text-muted">Resetting removes the local memory and keys. Credits stay on chain.</p>
    <button class="btn btn--danger" type="button">Reset citizen</button>
  </section>
</main>
<nav class="bottom-nav" aria-label="Main">
  <a href="lobby.html">Lobby</a>
  <a href="chat.html">Chat</a>
  <a href="services.html">Services</a>
  <a href="wallet.html">Wallet</a>
</nav>
</body>
</html>
